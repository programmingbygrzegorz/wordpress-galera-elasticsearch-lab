# S3 na VPS3: SeaweedFS (master + volume + filer + bramka S3 w jednym procesie).
# WordPress widzi go przez s3fs tak samo jak każdy magazyn S3.

- name: Użytkownik systemowy seaweedfs
  ansible.builtin.user:
    name: seaweedfs
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/seaweedfs
    create_home: true

- name: Czy SeaweedFS jest zainstalowany
  ansible.builtin.stat:
    path: /usr/local/bin/weed
  register: seaweedfs_bin

- name: Pobranie SeaweedFS (najnowsze wydanie z GitHuba)
  ansible.builtin.unarchive:
    src: "{{ seaweedfs_url }}"
    dest: /usr/local/bin
    remote_src: true
    include: [weed]
    mode: "0755"
  when: not seaweedfs_bin.stat.exists

- name: Katalog konfiguracji
  ansible.builtin.file:
    path: /etc/seaweedfs
    state: directory
    owner: root
    group: seaweedfs
    mode: "0750"

- name: Klucze dostępu do S3
  ansible.builtin.template:
    src: s3.json.j2
    dest: /etc/seaweedfs/s3.json
    owner: root
    group: seaweedfs
    mode: "0640"
  notify: Restart seaweedfs

- name: Usługa systemd
  ansible.builtin.template:
    src: seaweedfs.service.j2
    dest: /etc/systemd/system/seaweedfs.service
    mode: "0644"
  notify: Restart seaweedfs

- name: SeaweedFS uruchomiony
  ansible.builtin.systemd_service:
    name: seaweedfs
    state: started
    enabled: true
    daemon_reload: true

- name: Restart po zmianie konfiguracji
  ansible.builtin.meta: flush_handlers

- name: Bramka S3 odpowiada
  ansible.builtin.wait_for:
    host: "{{ node_ip }}"
    port: "{{ s3_port }}"
    timeout: 120

- name: Bucket na pliki WordPressa
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(seq 1 30); do
      if echo "s3.bucket.list" | weed shell -master={{ node_ip }}:9333 2>/dev/null | grep -qw "{{ s3_bucket }}"; then
        echo "exists"; exit 0
      fi
      echo "s3.bucket.create -name {{ s3_bucket }}" | weed shell -master={{ node_ip }}:9333 >/dev/null 2>&1 || true
      sleep 3
    done
    echo "Nie udało się utworzyć bucketu" >&2; exit 1
  args:
    executable: /bin/bash
  register: seaweedfs_bucket
  changed_when: "'exists' not in seaweedfs_bucket.stdout_lines[:1]"
