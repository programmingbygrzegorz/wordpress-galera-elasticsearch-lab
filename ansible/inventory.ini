# Każda maszyna uruchamia Ansible u siebie (Vagrant: ansible_local z --limit <nazwa>),
# dlatego połączenie jest lokalne. Adresy IP są w group_vars/all.yml (lab_hosts).

[loadbalancer]
lb

[web]
vps1
vps2

[data]
vps3

[galera:children]
web
data

[elasticsearch:children]
web
data

[all:vars]
ansible_connection=local
ansible_python_interpreter=/usr/bin/python3
